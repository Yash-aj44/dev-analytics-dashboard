<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Analytics Dashboard</title>
    <link rel="stylesheet"href="style.css">
    <script 
    src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <h2>DevDashboard</h2>
        <button id="themeToggle">Toggle Theme</button>
    </nav>

    <section class="stats">
        <div class="card">
            <h3>Commits</h3>
            <p class="counter" data-target="1245">0</p>
        </div>
        <div class="card">
            <h3>Projects</h3>
            <p class="counter" data-target="18">0</p>

        </div>
         <div class="card">
            <h3>Hours Coded</h3>
            <p class="counter" data-target="540">0</p>


        </div>   
     </section>

     <section class="charts">
        <div class="chart-box">
            <canvas id="lineChart"></canvas>

        </div>
        <div class="chart-box">
            <canvas id="barChart"></canvas>
        </div>
     </section>

     <section class="projects">
        <h2>Projects</h2>
        <input type="text" id="search" placeholder="Search projects...">
        <div class="project-grid" id="projectGrid"></div>
     </section>

     <script src="script.js"></script>
    
</body>
</html>
